plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aegeanworks.cardmon'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aegeanworks.cardmon'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No third-party dependencies: the app is a focused WebView client for
    // the local CardMon sync server.
}
